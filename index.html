<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Package Manager</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #222;
    --border: #2e2e2e; --accent: #4f9eff; --accent2: #38d9a9;
    --text: #e0e0e0; --dim: #666; --err: #ff5555;
    --radius: 6px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; min-height: 100vh; padding: 32px 24px; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; color: #fff; }
  .subtitle { color: var(--dim); font-size: 13px; margin-bottom: 28px; }
  #search-wrap { position: relative; margin-bottom: 20px; }
  #search { width: 100%; padding: 10px 14px 10px 38px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s; }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--dim); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--dim); font-size: 15px; pointer-events: none; }
  #tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: none; color: var(--dim); font-size: 12px; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.3px; }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
    transition: border-color 0.2s, transform 0.15s; }
  .card:hover { border-color: #444; transform: translateY(-1px); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-name { font-weight: 600; font-size: 15px; color: #fff; }
  .card-version { font-size: 11px; color: var(--dim); background: var(--bg3);
    padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
  .card-desc { font-size: 13px; color: var(--dim); line-height: 1.5; flex: 1; }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: var(--bg3); color: #aaa; border: 1px solid var(--border); }
  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .card-file { font-size: 11px; color: var(--dim); font-family: monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .btn-dl { display: flex; align-items: center; gap: 5px; padding: 6px 14px;
    background: var(--accent); border: none; border-radius: var(--radius);
    color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s, opacity 0.15s; white-space: nowrap; flex-shrink: 0; }
  .btn-dl:hover { background: #3a8aee; }
  .btn-dl.loading { opacity: 0.6; pointer-events: none; }
  .btn-dl.done { background: var(--accent2); }
  .btn-dl.error { background: var(--err); }
  .empty { grid-column: 1/-1; text-align: center; color: var(--dim); padding: 48px 0; font-size: 14px; }
</style>
</head>
<body>

<h1>📦 Package Manager</h1>
<p class="subtitle">Fetch and download files directly from GitHub</p>

<div id="search-wrap">
  <span class="search-icon">🔍</span>
  <input id="search" type="text" placeholder="Search packages…" oninput="render()">
</div>

<div id="tabs"></div>
<div id="grid"></div>

<script>
var REGISTRY_URL = './packages.json';

var PACKAGES = [];
var activeTab = 'All';

function getCategories() {
  var cats = ['All'];
  PACKAGES.forEach(function(p) {
    if (cats.indexOf(p.category) === -1) cats.push(p.category);
  });
  return cats;
}

function rawUrl(pkg) {
  return './files/' + pkg.filename;
}

function downloadPkg(pkg, btn) {
  btn.textContent = '⏳ Fetching…';
  btn.classList.add('loading');
  fetch(rawUrl(pkg))
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.blob();
    })
    .then(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = pkg.filename || pkg.path.split('/').pop();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.textContent = '✓ Downloaded';
      btn.classList.remove('loading');
      btn.classList.add('done');
      setTimeout(function() { btn.textContent = '⬇ Download'; btn.classList.remove('done'); }, 2500);
    })
    .catch(function(err) {
      btn.textContent = '✗ Failed';
      btn.classList.remove('loading');
      btn.classList.add('error');
      setTimeout(function() { btn.textContent = '⬇ Download'; btn.classList.remove('error'); }, 2500);
      console.error('Download failed:', err);
    });
}

function render() {
  var query = document.getElementById('search').value.toLowerCase();
  var tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  getCategories().forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'tab' + (cat === activeTab ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = function() { activeTab = cat; render(); };
    tabsEl.appendChild(btn);
  });

  var filtered = PACKAGES.filter(function(p) {
    var matchCat = activeTab === 'All' || p.category === activeTab;
    var matchQ = !query ||
      p.name.toLowerCase().indexOf(query) !== -1 ||
      p.desc.toLowerCase().indexOf(query) !== -1 ||
      (p.tags || []).some(function(t) { return t.toLowerCase().indexOf(query) !== -1; });
    return matchCat && matchQ;
  });

  var grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (!filtered.length) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No packages found.';
    grid.appendChild(empty);
    return;
  }

  filtered.forEach(function(pkg) {
    var card = document.createElement('div');
    card.className = 'card';
    var top = document.createElement('div');
    top.className = 'card-top';
    var nameEl = document.createElement('span');
    nameEl.className = 'card-name';
    nameEl.textContent = pkg.name;
    var verEl = document.createElement('span');
    verEl.className = 'card-version';
    verEl.textContent = pkg.version || '';
    top.appendChild(nameEl);
    top.appendChild(verEl);
    var desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = pkg.desc;
    var meta = document.createElement('div');
    meta.className = 'card-meta';
    (pkg.tags || []).forEach(function(t) {
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = t;
      meta.appendChild(tag);
    });
    var footer = document.createElement('div');
    footer.className = 'card-footer';
    var fileLabel = document.createElement('span');
    fileLabel.className = 'card-file';
    fileLabel.title = pkg.path;
    fileLabel.textContent = pkg.path;
    var btn = document.createElement('button');
    btn.className = 'btn-dl';
    btn.innerHTML = '⬇ Download';
    btn.onclick = function() { downloadPkg(pkg, btn); };
    footer.appendChild(fileLabel);
    footer.appendChild(btn);
    card.appendChild(top);
    card.appendChild(desc);
    if (pkg.tags && pkg.tags.length) card.appendChild(meta);
    card.appendChild(footer);
    grid.appendChild(card);
  });
}

function init() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '<div class="empty">⏳ Loading registry…</div>';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', REGISTRY_URL, true);
  xhr.onload = function() {
    try {
      var raw = xhr.responseText;
      raw = raw.replace(/^\uFEFF/, '');
      raw = raw.replace(/^[^[{]*/, '');
      raw = raw.replace(/[^}\]]*$/, '');
      PACKAGES = JSON.parse(raw);
      render();
    } catch(e) {
      grid.innerHTML = '<div class="empty" style="color:var(--err)">✗ Could not parse registry.<br><small>' + e.message + '</small></div>';
    }
  };
  xhr.onerror = function() {
    grid.innerHTML = '<div class="empty" style="color:var(--err)">✗ Could not load registry.</div>';
  };
  xhr.send();
}

init();
</script>
</body>
</html>
