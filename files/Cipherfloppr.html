<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipherfloppr_ Terminal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green:#39ff14; --green-dim:#1a7a06; --green-faint:#0a2a03;
    --bg:#070c07; --bg2:#0b110b; --border:#162a10;
    --yellow:#ffd700; --cyan:#00e5ff; --red:#ff3a3a;
    --white:#dfffdf; --gray:#3a5a3a;
  }
  html, body { height:100%; background:var(--bg); color:var(--green);
    font-family:'Courier New',Courier,monospace; font-size:13px; overflow:hidden; }

  #matrix { position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0; opacity:0.18; }

  #app { display:flex; flex-direction:column; height:100vh; position:relative; z-index:1; }

  #titlebar { display:flex; justify-content:space-between; align-items:center;
    padding:6px 14px; background:var(--bg2);
    border-bottom:1px solid var(--border); flex-shrink:0; }
  #titlebar .title { font-size:12px; letter-spacing:4px; color:var(--green); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--green); margin-right:6px; animation:blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.15;} }

  #workspace { display:flex; flex:1; overflow:hidden; }

  #terminal { flex:1; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--border); }
  #output { flex:1; overflow-y:auto; padding:10px 14px; line-height:2; word-break:break-word; }
  #output::-webkit-scrollbar { width:5px; }
  #output::-webkit-scrollbar-track { background:var(--bg); }
  #output::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  .ln { display:block; }
  .c-cmd     { color:var(--green); }
  .c-out     { color:var(--white); }
  .c-info    { color:var(--yellow); }
  .c-cipher  { color:var(--cyan); }
  .c-err     { color:var(--red); }
  .c-dim     { color:var(--gray); }
  .c-encoded { color:var(--white); letter-spacing:0.5px; word-break:break-all; }
  .c-progress{ color:var(--green); letter-spacing:2px; }

  #inputbar { display:flex; align-items:center; gap:8px;
    padding:8px 14px; border-top:1px solid var(--border);
    background:var(--bg2); flex-shrink:0; }
  #prompt { color:var(--green); white-space:nowrap; user-select:none; }
  #cmd { flex:1; background:transparent; border:none; outline:none;
    color:var(--green); font-family:inherit; font-size:13px; caret-color:var(--green); }
  #cmd::placeholder { color:var(--green-faint); }

  #buffer-panel { width:33.333%; flex-shrink:0; display:flex; flex-direction:column; background:var(--bg2); }
  #buffer-header { padding:6px 12px; border-bottom:1px solid var(--border);
    font-size:11px; color:var(--gray); letter-spacing:2px;
    text-transform:uppercase; display:flex; justify-content:space-between; }
  #buffer-mode { color:var(--cyan); }
  #buffer { flex:1; background:transparent; border:none; outline:none;
    color:var(--white); font-family:inherit; font-size:13px;
    padding:10px 12px; resize:none; line-height:1.65; }
  #buffer::placeholder { color:var(--green-faint); font-size:12px; }
  #buffer-footer { padding:5px 12px; border-top:1px solid var(--border);
    font-size:11px; color:var(--gray); display:flex; justify-content:space-between; }

  #mobile-btn { background:none; border:1px solid var(--border);
    color:var(--gray); font-family:inherit; font-size:11px;
    padding:3px 8px; border-radius:3px; cursor:pointer;
    letter-spacing:1px; margin-left:10px; transition:all 0.2s; white-space:nowrap; }
  #mobile-btn:hover { border-color:var(--green); color:var(--green); }
  #status-label { display:inline; }

  #tab-bar { display:none; flex-shrink:0; border-bottom:1px solid var(--border); background:var(--bg2); }
  .tab { flex:1; padding:12px; text-align:center; font-size:13px;
    letter-spacing:2px; color:var(--gray); cursor:pointer;
    border:none; border-bottom:2px solid transparent;
    background:none; font-family:inherit; transition:color 0.15s; }
  .tab.active { color:var(--green); border-bottom:2px solid var(--green); }

  body.mobile #tab-bar             { display:flex; }
  body.mobile #workspace           { flex-direction:column; }
  body.mobile #terminal            { border-right:none; }
  body.mobile #buffer-panel        { width:100%; }
  body.mobile #terminal.hidden     { display:none; }
  body.mobile #buffer-panel.hidden { display:none; }
  body.mobile #output              { font-size:15px; line-height:1.85; padding:12px; }
  body.mobile #cmd                 { font-size:16px; }
  body.mobile #inputbar            { padding:12px 14px; }
  body.mobile #buffer              { font-size:16px; padding:12px; }
  body.mobile #prompt              { font-size:15px; }
  body.mobile #status-label        { display:none; }
  body.mobile #mobile-btn          { margin-left:0; }

  @media (max-width:600px) {
    #tab-bar             { display:flex; }
    #workspace           { flex-direction:column; }
    #terminal            { border-right:none; }
    #buffer-panel        { width:100%; }
    #terminal.hidden     { display:none; }
    #buffer-panel.hidden { display:none; }
    #output              { font-size:15px; line-height:1.85; padding:12px; }
    #cmd                 { font-size:16px; }
    #inputbar            { padding:12px 14px; }
    #buffer              { font-size:16px; padding:12px; }
    #prompt              { font-size:15px; }
    #status-label        { display:none; }
    #mobile-btn          { margin-left:0; }
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="app">
  <div id="titlebar">
    <span class="title"><span class="dot"></span>CIPHERFLOPPR_ TERMINAL</span>
    <span style="display:flex;align-items:center;">
      <span class="meta" id="status-label">READY</span>
      <button id="mobile-btn" onclick="toggleMobile()">&#128241; PHONE</button>
    </span>
  </div>
  <div id="tab-bar">
    <button class="tab active" id="tab-buf" onclick="switchTab('buffer')">// MESSAGE</button>
    <button class="tab"        id="tab-trm" onclick="switchTab('terminal')">// TERMINAL</button>
  </div>
  <div id="workspace">
    <div id="terminal">
      <div id="output"></div>
      <div id="inputbar">
        <span id="prompt">floppr_@cipher:~$</span>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="/help">
      </div>
    </div>
    <div id="buffer-panel">
      <div id="buffer-header">
        <span>// message buffer</span>
        <span id="buffer-mode">IDLE</span>
      </div>
      <textarea id="buffer" placeholder="Paste or type your message here…&#10;&#10;Then use /enc or /dec&#10;in the terminal."></textarea>
      <div id="buffer-footer">
        <span id="char-count">0 chars</span>
        <span style="color:var(--green-faint)">active buffer ↑</span>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
'use strict';

// ── Matrix rain ──────────────────────────────────
var canvas = document.getElementById('matrix');
var ctx = canvas.getContext('2d');
var CHARS = 'アイウエオカキクケコサシスセソ0123456789ABCDEF<>[]{}|/\\';
var cols, drops;

function initMatrix() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / 14);
  drops = [];
  for (var i = 0; i < cols; i++) drops[i] = 1;
}

function drawMatrix() {
  ctx.fillStyle = 'rgba(7,12,7,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#39ff14';
  ctx.font = '13px Courier New';
  for (var i = 0; i < drops.length; i++) {
    var ch = CHARS[Math.floor(Math.random() * CHARS.length)];
    ctx.fillText(ch, i * 14, drops[i] * 14);
    if (drops[i] * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}

initMatrix();
window.addEventListener('resize', initMatrix);
setInterval(drawMatrix, 50);

// ── Cipher helpers ────────────────────────────────
function rot13(s) {
  return s.replace(/[a-zA-Z]/g, function(c) {
    var b = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - b + 13) % 26) + b);
  });
}

function rot47(s) {
  return s.split('').map(function(c) {
    var n = c.charCodeAt(0);
    return (n >= 33 && n <= 126) ? String.fromCharCode(33 + ((n - 33 + 47) % 94)) : c;
  }).join('');
}

function atbash(s) {
  return s.replace(/[a-zA-Z]/g, function(c) {
    var b = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(b + 25 - (c.charCodeAt(0) - b));
  });
}

function caesar(s, n) {
  return s.replace(/[a-zA-Z]/g, function(c) {
    var b = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - b + n) % 26) + b);
  });
}

function rot5(s) {
  return s.replace(/[0-9]/g, function(c) {
    return String.fromCharCode(((c.charCodeAt(0) - 48 + 5) % 10) + 48);
  });
}

function rot18(s) { return rot13(rot5(s)); }

function reverseStr(s) { return s.split('').reverse().join(''); }
function reverseWords(s) { return s.split(/(\s+)/).reverse().join(''); }

function b64enc(s) {
  try { return btoa(unescape(encodeURIComponent(s))); } catch(e) { return btoa(s); }
}
function b64dec(s) {
  try { return decodeURIComponent(escape(atob(s))); } catch(e) {
    try { return atob(s); } catch(e2) { return '[INVALID-B64]'; }
  }
}

function xorFixed(s, k) {
  return s.split('').map(function(c) {
    return String.fromCharCode(c.charCodeAt(0) ^ k);
  }).join('');
}

function xorStr(s, k) {
  if (!k) return s;
  return s.split('').map(function(c, i) {
    return String.fromCharCode(c.charCodeAt(0) ^ k.charCodeAt(i % k.length));
  }).join('');
}

function vigenere(s, key, dec) {
  var k = ((key || 'CIPHER').toUpperCase().replace(/[^A-Z]/g, '')) || 'CIPHER';
  var ki = 0;
  return s.split('').map(function(c) {
    if (!/[a-zA-Z]/.test(c)) return c;
    var b = c <= 'Z' ? 65 : 97;
    var sh = k.charCodeAt(ki++ % k.length) - 65;
    return String.fromCharCode(((c.charCodeAt(0) - b + (dec ? 26 - sh : sh)) % 26) + b);
  }).join('');
}

function railFenceEnc(s, r) {
  var f = [], i;
  for (i = 0; i < r; i++) f[i] = [];
  var row = 0, d = 1;
  for (i = 0; i < s.length; i++) {
    f[row].push(s[i]);
    if (row === 0) d = 1; else if (row === r - 1) d = -1;
    row += d;
  }
  return f.map(function(a) { return a.join(''); }).join('');
}

function railFenceDec(s, r) {
  var len = s.length, pat = [], i;
  var row = 0, d = 1;
  for (i = 0; i < len; i++) {
    pat.push(row);
    if (row === 0) d = 1; else if (row === r - 1) d = -1;
    row += d;
  }
  var cnt = [];
  for (i = 0; i < r; i++) cnt[i] = 0;
  for (i = 0; i < pat.length; i++) cnt[pat[i]]++;
  var pos = 0, f = [];
  for (i = 0; i < r; i++) { f.push(s.slice(pos, pos + cnt[i]).split('')); pos += cnt[i]; }
  var idx = [];
  for (i = 0; i < r; i++) idx[i] = 0;
  return pat.map(function(x) { return f[x][idx[x]++]; }).join('');
}

function colTransposeEnc(s, key) {
  var k = ((key || 'KEY').toUpperCase().replace(/[^A-Z]/g, '')) || 'KEY';
  var cols = k.length, rows = Math.ceil(s.length / cols);
  var padded = s;
  while (padded.length < rows * cols) padded += '\x00';
  var order = k.split('').map(function(c, i) { return [c, i]; })
    .sort(function(a, b) { return a[0].localeCompare(b[0]); })
    .map(function(x) { return x[1]; });
  var out = '';
  for (var oi = 0; oi < order.length; oi++) {
    for (var row = 0; row < rows; row++) out += padded[row * cols + order[oi]];
  }
  return out;
}

function colTransposeDec(s, key) {
  var k = ((key || 'KEY').toUpperCase().replace(/[^A-Z]/g, '')) || 'KEY';
  var cols = k.length, rows = Math.ceil(s.length / cols);
  var order = k.split('').map(function(c, i) { return [c, i]; })
    .sort(function(a, b) { return a[0].localeCompare(b[0]); })
    .map(function(x) { return x[1]; });
  var grid = [], i;
  for (i = 0; i < cols; i++) grid[i] = [];
  var pos = 0;
  for (i = 0; i < order.length; i++) {
    for (var row = 0; row < rows; row++) grid[order[i]].push(s[pos++]);
  }
  var out = '';
  for (row = 0; row < rows; row++) {
    for (var c = 0; c < cols; c++) out += grid[c][row] || '';
  }
  return out.replace(/\x00+$/, '');
}

// ── Cipher registry ───────────────────────────────
var C = [
  { name:'ROT13',    enc:rot13,                         dec:rot13 },
  { name:'ROT47',    enc:rot47,                         dec:rot47 },
  { name:'ROT18',    enc:rot18,                         dec:rot18 },
  { name:'Atbash',   enc:atbash,                        dec:atbash },
  { name:'Caesar+3', enc:function(s){return caesar(s,3);},  dec:function(s){return caesar(s,23);} },
  { name:'Caesar+7', enc:function(s){return caesar(s,7);},  dec:function(s){return caesar(s,19);} },
  { name:'Caesar+11',enc:function(s){return caesar(s,11);}, dec:function(s){return caesar(s,15);} },
  { name:'XOR-0x5A', enc:function(s){return xorFixed(s,0x5A);}, dec:function(s){return xorFixed(s,0x5A);} },
  { name:'XOR-Key',  enc:function(s,k){return xorStr(s,k);},    dec:function(s,k){return xorStr(s,k);} },
  { name:'Reverse',  enc:reverseStr,                    dec:reverseStr },
  { name:'Vigenere', enc:function(s,k){return vigenere(s,k,false);}, dec:function(s,k){return vigenere(s,k,true);} },
  { name:'Base64',   enc:b64enc,                        dec:b64dec },
  { name:'Rail-2',   enc:function(s){return railFenceEnc(s,2);}, dec:function(s){return railFenceDec(s,2);} },
  { name:'Rail-3',   enc:function(s){return railFenceEnc(s,3);}, dec:function(s){return railFenceDec(s,3);} },
  { name:'ColTrans', enc:function(s,k){return colTransposeEnc(s,k);}, dec:function(s,k){return colTransposeDec(s,k);} },
  { name:'RevWords', enc:reverseWords, dec:reverseWords }
];

var SALT_ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

function addSalt(s, n) {
  var r = '';
  for (var i = 0; i < n; i++) r += SALT_ABC[Math.floor(Math.random() * SALT_ABC.length)];
  return r + s;
}
function stripSalt(s, n) { return s.slice(n); }
function pwToChain(pw) {
  return pw.split('').map(function(c) { return c.charCodeAt(0) % C.length; });
}

function encodeText(text, pw, key) {
  var chain = pwToChain(pw);
  var s = addSalt(text, pw.length);
  for (var i = 0; i < chain.length; i++) s = C[chain[i]].enc(s, key);
  s = b64enc(s);
  return { result: s, chain: chain };
}

function decodeText(text, pw, key) {
  var chain = pwToChain(pw);
  var s = b64dec(text);
  var rev = chain.slice().reverse();
  for (var i = 0; i < rev.length; i++) s = C[rev[i]].dec(s, key);
  return { result: stripSalt(s, pw.length), chain: chain };
}

// ── DOM refs ──────────────────────────────────────
var outEl   = document.getElementById('output');
var cmdEl   = document.getElementById('cmd');
var bufEl   = document.getElementById('buffer');
var ccEl    = document.getElementById('char-count');
var bmodeEl = document.getElementById('buffer-mode');

var lastOut = '';
var hist = [], hIdx = -1;
var bufLog = [];

function ln(text, cls) {
  text = text === undefined ? '' : text;
  cls  = cls  || 'c-out';
  var el = document.createElement('span');
  el.className = 'ln ' + cls;
  el.textContent = text;
  outEl.appendChild(el);
  outEl.scrollTop = outEl.scrollHeight;
  return el;
}

function pushLog(label, text) {
  bufLog.unshift({ label: label, text: text });
  if (bufLog.length > 10) bufLog.pop();
}

// ── Progress bar ──────────────────────────────────
function runProgress(steps, onDone) {
  var BAR = 10;
  var el = ln('  [' + new Array(BAR + 1).join('-') + ']', 'c-progress');
  var i = 0;
  var iv = setInterval(function() {
    i++;
    var filled = Math.round((i / steps) * BAR);
    el.textContent = '  [' + new Array(filled + 1).join('#') + new Array(BAR - filled + 1).join('-') + ']';
    outEl.scrollTop = outEl.scrollHeight;
    if (i >= steps) {
      clearInterval(iv);
      setTimeout(onDone, 60);
    }
  }, 40);
}

function doWithProgress(fn) {
  cmdEl.disabled = true;
  runProgress(10, function() {
    fn();
    cmdEl.disabled = false;
    cmdEl.focus();
  });
}

// ── Commands ──────────────────────────────────────
function parseArgs(s) {
  var i = s.indexOf('/');
  if (i < 0) return { pw: s.trim(), key: s.trim() };
  var pw  = s.slice(0, i).trim();
  var key = s.slice(i + 1).trim() || pw;
  return { pw: pw, key: key };
}

function doEncode(args) {
  var p = parseArgs(args);
  var text = bufEl.value;
  if (!p.pw)         { ln('ERR: password required.', 'c-err'); return; }
  if (!text.trim())  { ln('ERR: message buffer is empty.', 'c-err'); return; }
  try {
    pushLog('pre-enc', text);
    var res = encodeText(text, p.pw, p.key);
    lastOut = res.result;
    bufEl.value = res.result;
    pushLog('enc', res.result);
    bmodeEl.textContent = 'ENCODED';
    ccEl.textContent = res.result.length + ' chars';
    ln(res.result, 'c-encoded');
  } catch(e) { ln('ERR: ' + e.message, 'c-err'); }
}

function doDecode(args) {
  var p = parseArgs(args);
  var text = bufEl.value;
  if (!p.pw)        { ln('ERR: password required.', 'c-err'); return; }
  if (!text.trim()) { ln('ERR: message buffer is empty.', 'c-err'); return; }
  try {
    pushLog('pre-dec', text);
    var res = decodeText(text, p.pw, p.key);
    lastOut = res.result;
    bufEl.value = res.result;
    pushLog('dec', res.result);
    bmodeEl.textContent = 'DECODED';
    ccEl.textContent = res.result.length + ' chars';
    ln(res.result, 'c-encoded');
  } catch(e) { ln('ERR: ' + e.message, 'c-err'); }
}

function doUndo() {
  if (bufLog.length < 2) { ln('ERR: nothing to undo.', 'c-err'); return; }
  var prev = bufLog[1];
  bufEl.value = prev.text;
  ccEl.textContent = prev.text.length + ' chars';
  bmodeEl.textContent = 'RESTORED';
  ln('OK: buffer restored to [' + prev.label + ']', 'c-info');
}

function doLog(arg) {
  if (!bufLog.length) { ln('ERR: log is empty.', 'c-err'); return; }
  var n = parseInt(arg, 10);
  if (!isNaN(n)) {
    var entry = bufLog[n];
    if (!entry) { ln('ERR: no log entry at index ' + n + '.', 'c-err'); return; }
    bufEl.value = entry.text;
    ccEl.textContent = entry.text.length + ' chars';
    bmodeEl.textContent = 'RESTORED';
    ln('OK: buffer restored to log[' + n + '] [' + entry.label + ']', 'c-info');
    return;
  }
  ln('  BUFFER LOG  (0 = most recent)', 'c-info');
  for (var i = 0; i < bufLog.length; i++) {
    var e = bufLog[i];
    var preview = e.text.length > 40 ? e.text.slice(0, 40) + '…' : e.text;
    ln('  [' + i + '] ' + e.label + '   ' + preview, 'c-dim');
  }
}

function doHelp() {
  ln('', 'c-out');
  ln('  COMMANDS', 'c-info');
  ln('  /enc  [args]', 'c-out');
  ln('  /dec  [args]', 'c-out');
  ln('  /undo', 'c-out');
  ln('  /log', 'c-out');
  ln('  /log [n]', 'c-out');
  ln('  /copy', 'c-out');
  ln('  /clear', 'c-out');
  ln('', 'c-out');
}

function doCopy() {
  if (!lastOut) { ln('ERR: nothing to copy yet.', 'c-err'); return; }
  navigator.clipboard.writeText(lastOut).then(
    function() { ln('OK: copied to clipboard.', 'c-info'); },
    function() { ln('ERR: clipboard access denied.', 'c-err'); }
  );
}

function run(raw) {
  var input = raw.trim();
  if (!input) return;
  hist.unshift(input); hIdx = -1;
  ln('floppr_@cipher:~$ ' + input, 'c-cmd');

  if      (input === '/help')              doHelp();
  else if (input === '/clear')             outEl.innerHTML = '';
  else if (input === '/copy')              doCopy();
  else if (input === '/undo')              doUndo();
  else if (input.indexOf('/log') === 0)    doLog(input.slice(4).trim());
  else if (input.indexOf('/enc ') === 0)   doWithProgress(function() { doEncode(input.slice(5).trim()); });
  else if (input.indexOf('/dec ') === 0)   doWithProgress(function() { doDecode(input.slice(5).trim()); });
  else ln('ERR: unknown command.', 'c-err');
}

// ── Boot ──────────────────────────────────────────
function boot() {
  setTimeout(function() { ln('// Cipherfloppr_ Terminal  v2.0', 'c-cipher'); }, 0);
  setTimeout(function() { ln('// Type /help to begin.', 'c-dim'); }, 80);
  setTimeout(function() { ln('', 'c-out'); }, 160);
}

// ── Input events ──────────────────────────────────
cmdEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    run(cmdEl.value);
    cmdEl.value = '';
  } else if (e.key === 'ArrowUp') {
    hIdx = Math.min(hIdx + 1, hist.length - 1);
    cmdEl.value = hist[hIdx] || '';
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    hIdx = Math.max(hIdx - 1, -1);
    cmdEl.value = hIdx >= 0 ? hist[hIdx] : '';
    e.preventDefault();
  }
});

bufEl.addEventListener('input', function() {
  ccEl.textContent = bufEl.value.length + ' chars';
  bmodeEl.textContent = 'IDLE';
});

outEl.addEventListener('click', function() { cmdEl.focus(); });

// ── Mobile ────────────────────────────────────────
var mobileMode = false;

function toggleMobile() {
  mobileMode = !mobileMode;
  document.body.classList.toggle('mobile', mobileMode);
  document.getElementById('mobile-btn').textContent = mobileMode ? '🖥 DESKTOP' : '📱 PHONE';
  if (mobileMode) {
    switchTab('buffer');
  } else {
    document.getElementById('terminal').classList.remove('hidden');
    document.getElementById('buffer-panel').classList.remove('hidden');
  }
}

function switchTab(tab) {
  var trm    = document.getElementById('terminal');
  var bufP   = document.getElementById('buffer-panel');
  var tabBuf = document.getElementById('tab-buf');
  var tabTrm = document.getElementById('tab-trm');
  if (tab === 'buffer') {
    trm.classList.add('hidden');
    bufP.classList.remove('hidden');
    tabBuf.classList.add('active');
    tabTrm.classList.remove('active');
  } else {
    bufP.classList.add('hidden');
    trm.classList.remove('hidden');
    tabTrm.classList.add('active');
    tabBuf.classList.remove('active');
    cmdEl.focus();
  }
}

boot();
if (window.innerWidth <= 600) {
  mobileMode = true;
  document.body.classList.add('mobile');
  document.getElementById('mobile-btn').textContent = '🖥 DESKTOP';
  switchTab('buffer');
}
cmdEl.focus();

})();
</script>
</body>
</html>
