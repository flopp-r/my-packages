<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINESWEEPER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #0f1318;
    --border: #1e3a2f;
    --green: #00ff88;
    --green-dim: #00c866;
    --green-dark: #004422;
    --green-glow: rgba(0,255,136,0.15);
    --red: #ff3355;
    --red-glow: rgba(255,51,85,0.3);
    --yellow: #ffcc00;
    --blue: #00aaff;
    --cell-size: 36px;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Orbitron', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(0,60,30,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(0,40,80,0.2) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,255,136,0.03) 39px, rgba(0,255,136,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,255,136,0.03) 39px, rgba(0,255,136,0.03) 40px);
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── Header ── */
  .header {
    width: 100%;
    text-align: center;
    margin-bottom: 6px;
    position: relative;
  }

  .title {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 14px;
    color: var(--green);
    text-shadow: 0 0 20px var(--green), 0 0 40px rgba(0,255,136,0.4);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 0.8s 0.2s ease forwards;
  }

  .subtitle {
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(0,255,136,0.4);
    margin-top: 4px;
    opacity: 0;
    animation: fadeIn 0.8s 0.5s ease forwards;
  }

  /* ── Difficulty Selector ── */
  .difficulty-row {
    display: flex;
    gap: 2px;
    margin: 14px 0 10px;
    opacity: 0;
    animation: fadeIn 0.6s 0.7s ease forwards;
  }

  .diff-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: rgba(0,255,136,0.5);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    padding: 5px 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .diff-btn:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-glow);
    box-shadow: 0 0 12px rgba(0,255,136,0.2);
  }

  .diff-btn.active {
    border-color: var(--green);
    color: var(--bg);
    background: var(--green);
    box-shadow: 0 0 20px rgba(0,255,136,0.5);
    font-weight: bold;
  }

  /* ── HUD ── */
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--panel);
    position: relative;
    opacity: 0;
    animation: fadeIn 0.6s 0.9s ease forwards;
  }

  .hud::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.6;
  }

  .hud-display {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    min-width: 60px;
    text-align: center;
    color: var(--red);
    text-shadow: 0 0 12px var(--red);
    letter-spacing: 2px;
  }

  .hud-display.timer {
    color: var(--green);
    text-shadow: 0 0 12px var(--green);
  }

  .hud-label {
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(0,255,136,0.35);
    text-align: center;
    margin-top: 2px;
    text-transform: uppercase;
  }

  .hud-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    color: var(--green);
    position: relative;
    overflow: hidden;
  }

  .reset-btn:hover {
    border-color: var(--green);
    background: var(--green-glow);
    box-shadow: 0 0 15px rgba(0,255,136,0.3);
    transform: scale(1.05);
  }

  .reset-btn:active { transform: scale(0.95); }

  /* ── Grid ── */
  .board-wrapper {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 10px;
    position: relative;
    opacity: 0;
    animation: fadeIn 0.6s 1.1s ease forwards;
  }

  .board-wrapper::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.4;
  }

  #board {
    display: grid;
    gap: 2px;
  }

  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    border: 1px solid rgba(0,255,136,0.15);
    background: rgba(0,255,136,0.04);
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, border-color 0.1s, transform 0.05s;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }

  .cell:hover:not(.revealed):not(.exploded) {
    background: rgba(0,255,136,0.12);
    border-color: rgba(0,255,136,0.5);
    box-shadow: inset 0 0 8px rgba(0,255,136,0.1);
  }

  .cell:active:not(.revealed) { transform: scale(0.92); }

  .cell.revealed {
    background: rgba(0,255,136,0.02);
    border-color: rgba(0,255,136,0.06);
    cursor: default;
  }

  .cell.flagged {
    background: rgba(0,255,136,0.07);
    border-color: rgba(0,255,136,0.4);
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow);
  }

  .cell.mine-revealed {
    background: rgba(255,51,85,0.15);
    border-color: var(--red);
  }

  .cell.exploded {
    background: var(--red-glow);
    border-color: var(--red);
    animation: explode 0.4s ease;
  }

  .cell.wrong-flag {
    background: rgba(255,51,85,0.15);
    border-color: var(--red);
    color: var(--red);
  }

  /* Number colors */
  .n1 { color: #00aaff; text-shadow: 0 0 8px #00aaff; }
  .n2 { color: #00ff88; text-shadow: 0 0 8px #00ff88; }
  .n3 { color: #ff3355; text-shadow: 0 0 8px #ff3355; }
  .n4 { color: #8844ff; text-shadow: 0 0 8px #8844ff; }
  .n5 { color: #ff6600; text-shadow: 0 0 8px #ff6600; }
  .n6 { color: #00ffee; text-shadow: 0 0 8px #00ffee; }
  .n7 { color: #ff44aa; text-shadow: 0 0 8px #ff44aa; }
  .n8 { color: rgba(0,255,136,0.5); }

  /* ── Overlay ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .overlay.active { display: flex; }

  .overlay-box {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 40px 50px;
    text-align: center;
    position: relative;
    animation: slideUp 0.3s ease;
  }

  .overlay-box::before, .overlay-box::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
  }
  .overlay-box::before { top: 0; }
  .overlay-box::after { bottom: 0; }

  .overlay-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
  }

  .overlay-title.win { color: var(--green); text-shadow: 0 0 30px var(--green); }
  .overlay-title.lose { color: var(--red); text-shadow: 0 0 30px var(--red); }

  .overlay-sub {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(0,255,136,0.5);
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .overlay-stats {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .stat-block { text-align: center; }

  .stat-val {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
  }

  .stat-lbl {
    font-size: 8px;
    letter-spacing: 2px;
    color: rgba(0,255,136,0.4);
    text-transform: uppercase;
    margin-top: 3px;
  }

  .play-again-btn {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 4px;
    padding: 10px 28px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .play-again-btn:hover {
    background: var(--green);
    color: var(--bg);
    box-shadow: 0 0 25px rgba(0,255,136,0.5);
  }

  /* ── Scanlines overlay ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.03) 0px,
      rgba(0,0,0,0.03) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
    z-index: 200;
  }

  /* ── Animations ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes explode {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.3); background: var(--red); }
    100% { transform: scale(1); }
  }

  @keyframes revealPop {
    0%   { transform: scale(0.8); opacity: 0.5; }
    60%  { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  .cell.reveal-anim { animation: revealPop 0.12s ease; }

  /* Pulse on flag plant */
  @keyframes flagPulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,204,0,0.4); }
    100% { box-shadow: 0 0 0 10px rgba(255,204,0,0); }
  }
  .cell.flag-anim { animation: flagPulse 0.4s ease; }

  /* Instructions */
  .instructions {
    margin-top: 10px;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(0,255,136,0.25);
    text-align: center;
    opacity: 0;
    animation: fadeIn 0.6s 1.4s ease forwards;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">Minesweeper</div>
    <div class="subtitle">Neural Hazard Detection System</div>
  </div>

  <div class="difficulty-row">
    <button class="diff-btn active" data-diff="easy">Easy</button>
    <button class="diff-btn" data-diff="medium">Medium</button>
    <button class="diff-btn" data-diff="hard">Hard</button>
  </div>

  <div class="hud" id="hud">
    <div>
      <div class="hud-display" id="mineCount">000</div>
      <div class="hud-label">Mines</div>
    </div>
    <div class="hud-center">
      <button class="reset-btn" id="resetBtn" title="New Game">⟳</button>
    </div>
    <div>
      <div class="hud-display timer" id="timer">000</div>
      <div class="hud-label">Seconds</div>
    </div>
  </div>

  <div class="board-wrapper">
    <div id="board"></div>
  </div>

  <div class="instructions">
    LEFT CLICK — reveal &nbsp;|&nbsp; RIGHT CLICK — flag &nbsp;|&nbsp; LONG PRESS — flag (mobile)
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="overlay-title" id="overlayTitle">—</div>
    <div class="overlay-sub" id="overlaySub">—</div>
    <div class="overlay-stats">
      <div class="stat-block">
        <div class="stat-val" id="statTime">—</div>
        <div class="stat-lbl">Time</div>
      </div>
      <div class="stat-block">
        <div class="stat-val" id="statMines">—</div>
        <div class="stat-lbl">Mines</div>
      </div>
    </div>
    <button class="play-again-btn" id="playAgainBtn">[ PLAY AGAIN ]</button>
  </div>
</div>

<script>
const CONFIGS = {
  easy:   { rows: 9,  cols: 9,  mines: 10 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard:   { rows: 16, cols: 30, mines: 99 },
};

let config = CONFIGS.easy;
let board = [];
let revealed = [];
let flagged = [];
let minePositions = new Set();
let gameOver = false;
let gameStarted = false;
let timerInterval = null;
let seconds = 0;
let firstClick = true;
let flagCount = 0;

const boardEl   = document.getElementById('board');
const mineEl    = document.getElementById('mineCount');
const timerEl   = document.getElementById('timer');
const resetBtn  = document.getElementById('resetBtn');
const overlay   = document.getElementById('overlay');
const playAgain = document.getElementById('playAgainBtn');

function fmt(n) { return String(Math.min(Math.abs(n),999)).padStart(3,'0'); }

function initBoard() {
  clearInterval(timerInterval);
  seconds = 0;
  timerEl.textContent = '000';
  gameOver = false;
  gameStarted = false;
  firstClick = true;
  flagCount = 0;
  minePositions.clear();

  const { rows, cols, mines } = config;
  board = Array.from({ length: rows }, () => Array(cols).fill(0));
  revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
  flagged  = Array.from({ length: rows }, () => Array(cols).fill(false));

  mineEl.textContent = fmt(mines);
  resetBtn.textContent = '⟳';
  overlay.classList.remove('active');

  renderBoard();
}

function placeMines(safeR, safeC) {
  const { rows, cols, mines } = config;
  const safe = new Set();
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      const r = safeR + dr, c = safeC + dc;
      if (r >= 0 && r < rows && c >= 0 && c < cols)
        safe.add(r * cols + c);
    }
  while (minePositions.size < mines) {
    const idx = Math.floor(Math.random() * rows * cols);
    if (!safe.has(idx)) minePositions.add(idx);
  }
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      board[r][c] = minePositions.has(r * cols + c) ? -1 : 0;

  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === -1) continue;
      let cnt = 0;
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r+dr, nc = c+dc;
          if (nr>=0 && nr<rows && nc>=0 && nc<cols && board[nr][nc]===-1) cnt++;
        }
      board[r][c] = cnt;
    }
}

function renderBoard() {
  const { rows, cols } = config;
  boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
  boardEl.innerHTML = '';

  // Clamp cell size for large grids
  const maxW = Math.min(window.innerWidth - 60, 900);
  const cs = Math.max(22, Math.min(36, Math.floor((maxW - (cols-1)*2 - 20) / cols)));
  document.documentElement.style.setProperty('--cell-size', cs + 'px');

  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;

      // Mobile long-press flag
      let pressTimer = null;
      cell.addEventListener('touchstart', e => {
        pressTimer = setTimeout(() => { e.preventDefault(); toggleFlag(r,c,cell); }, 400);
      }, { passive: true });
      cell.addEventListener('touchend', () => clearTimeout(pressTimer));
      cell.addEventListener('touchmove', () => clearTimeout(pressTimer));

      cell.addEventListener('click', () => handleClick(r, c));
      cell.addEventListener('contextmenu', e => { e.preventDefault(); const el=boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`); toggleFlag(r,c,el); });
      boardEl.appendChild(cell);
    }
}

function getCellEl(r,c) {
  return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function handleClick(r, c) {
  if (gameOver || flagged[r][c] || revealed[r][c]) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    startTimer();
  }

  if (board[r][c] === -1) {
    triggerExplosion(r, c);
    return;
  }

  revealCell(r, c);
  checkWin();
}

function revealCell(r, c) {
  const { rows, cols } = config;
  if (r<0||r>=rows||c<0||c>=cols||revealed[r][c]||flagged[r][c]) return;
  revealed[r][c] = true;

  const el = getCellEl(r, c);
  el.classList.add('revealed', 'reveal-anim');
  const n = board[r][c];
  if (n > 0) {
    el.textContent = n;
    el.classList.add('n' + n);
  } else {
    // flood fill
    for (let dr=-1;dr<=1;dr++)
      for (let dc=-1;dc<=1;dc++)
        revealCell(r+dr, c+dc);
  }
}

function toggleFlag(r, c, el) {
  if (gameOver || revealed[r][c]) return;
  if (!gameStarted && firstClick) return; // no flags before first click
  flagged[r][c] = !flagged[r][c];
  if (flagged[r][c]) {
    flagCount++;
    el.textContent = '⚑';
    el.classList.add('flagged');
    el.classList.add('flag-anim');
    setTimeout(()=>el.classList.remove('flag-anim'),400);
  } else {
    flagCount--;
    el.textContent = '';
    el.classList.remove('flagged');
  }
  mineEl.textContent = fmt(config.mines - flagCount);
}

function triggerExplosion(r, c) {
  gameOver = true;
  clearInterval(timerInterval);
  resetBtn.textContent = '✕';

  const explodedEl = getCellEl(r, c);
  explodedEl.classList.add('revealed','exploded');
  explodedEl.textContent = '✸';

  // Reveal all mines with stagger
  let delay = 0;
  minePositions.forEach(idx => {
    const mr = Math.floor(idx / config.cols);
    const mc = idx % config.cols;
    if (mr===r && mc===c) return;
    setTimeout(() => {
      const el = getCellEl(mr, mc);
      if (flagged[mr][mc]) {
        el.classList.add('flagged'); // keep flag
      } else {
        el.classList.remove('flagged');
        el.classList.add('revealed','mine-revealed');
        el.textContent = '✸';
      }
    }, delay += 30);
  });

  // Show wrong flags
  for (let i=0;i<config.rows;i++)
    for (let j=0;j<config.cols;j++)
      if (flagged[i][j] && board[i][j]!==-1) {
        const el = getCellEl(i,j);
        el.classList.remove('flagged');
        el.classList.add('revealed','wrong-flag');
        el.textContent = '✗';
      }

  setTimeout(() => showOverlay(false), delay + 600);
}

function checkWin() {
  const { rows, cols, mines } = config;
  let unrev = 0;
  for (let r=0;r<rows;r++)
    for (let c=0;c<cols;c++)
      if (!revealed[r][c]) unrev++;
  if (unrev === mines) {
    gameOver = true;
    clearInterval(timerInterval);
    resetBtn.textContent = '✓';
    showOverlay(true);
  }
}

function startTimer() {
  gameStarted = true;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    timerEl.textContent = fmt(seconds);
    if (seconds >= 999) clearInterval(timerInterval);
  }, 1000);
}

function showOverlay(win) {
  const title = document.getElementById('overlayTitle');
  const sub   = document.getElementById('overlaySub');
  document.getElementById('statTime').textContent  = fmt(seconds) + 's';
  document.getElementById('statMines').textContent = config.mines;

  if (win) {
    title.className = 'overlay-title win';
    title.textContent = 'CLEARED';
    sub.textContent = 'Area secure — all hazards neutralized';
  } else {
    title.className = 'overlay-title lose';
    title.textContent = 'DETONATED';
    sub.textContent = 'Mission failed — mine triggered';
  }
  overlay.classList.add('active');
}

// Difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    config = CONFIGS[btn.dataset.diff];
    initBoard();
  });
});

resetBtn.addEventListener('click', initBoard);
playAgain.addEventListener('click', initBoard);

// Prevent context menu on board
boardEl.addEventListener('contextmenu', e => e.preventDefault());

initBoard();
</script>
</body>
</html>
