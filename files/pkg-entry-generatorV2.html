<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Package Entry Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #222;
    --border: #2e2e2e; --accent: #4f9eff; --green: #38d9a9;
    --text: #e0e0e0; --dim: #666; --err: #ff5555;
    --radius: 6px;
  }
  body { background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; min-height: 100vh; padding: 32px 24px; }

  h1 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .subtitle { color: var(--dim); font-size: 13px; margin-bottom: 24px; }

  .mode-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; width: fit-content; margin-bottom: 24px; }
  .mode-btn { padding: 9px 22px; background: none; border: none; color: var(--dim);
    font-family: inherit; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .mode-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

  .card { background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; max-width: 620px; margin: 0 auto; }

  .section-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--dim); margin-bottom: 14px; margin-top: 22px; }
  .section-label:first-child { margin-top: 0; }

  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  input[type=text], textarea {
    width: 100%; padding: 9px 12px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: inherit; font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  input[type=text]::placeholder, textarea::placeholder { color: var(--dim); }
  textarea { resize: vertical; min-height: 60px; }

  .hint { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .parsed-preview { background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; font-size: 12px;
    color: var(--green); margin-top: 8px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag-pill { display: flex; align-items: center; gap: 5px; padding: 3px 10px;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 20px;
    font-size: 12px; color: var(--text); }
  .tag-pill button { background: none; border: none; color: var(--dim);
    cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
  .tag-pill button:hover { color: var(--err); }

  .tag-input-row { display: flex; gap: 8px; }
  .tag-input-row input { flex: 1; }
  .btn-add { padding: 9px 14px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--accent); font-size: 13px;
    cursor: pointer; transition: border-color 0.15s; white-space: nowrap; }
  .btn-add:hover { border-color: var(--accent); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }

  .btn-gen { width: 100%; padding: 11px; background: var(--accent);
    border: none; border-radius: var(--radius); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px;
    transition: background 0.15s; }
  .btn-gen:hover { background: #3a8aee; }

  #output-section { max-width: 620px; margin: 20px auto 0; }
  #output-section h2 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 10px; }
  .output-box { position: relative; background: var(--bg2);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  #output-code { font-family: 'Courier New', monospace; font-size: 12px;
    color: var(--green); white-space: pre; overflow-x: auto; line-height: 1.7; }
  .btn-copy { position: absolute; top: 10px; right: 10px; padding: 5px 12px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--dim); font-size: 11px;
    cursor: pointer; transition: all 0.15s; }
  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
  .btn-copy.done { border-color: var(--green); color: var(--green); }

  .instructions { margin-top: 14px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .instructions p { font-size: 12px; color: var(--dim); line-height: 1.8; }
  .instructions b { color: var(--text); }
</style>
</head>
<body>

<div style="max-width:620px;margin:0 auto 20px;">
  <h1>📦 Package Entry Generator</h1>
  <p class="subtitle">Generate JSON snippets for packages.json</p>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-pkg" onclick="setMode('package')">📦 Package</button>
    <button class="mode-btn"        id="btn-tool" onclick="setMode('webtool')">🔗 Web Tool</button>
  </div>
</div>

<!-- PACKAGE FORM -->
<div class="card" id="pkg-form">
  <div class="section-label">GitHub Raw URL</div>
  <div class="field">
    <label>Paste the raw file URL from GitHub</label>
    <input type="text" id="raw-url" placeholder="https://raw.githubusercontent.com/flopp-r/my-packages/main/files/tool.html" oninput="parseUrl()">
    <div class="hint" id="url-hint">Fields below will fill automatically once a valid URL is pasted.</div>
  </div>
  <div class="parsed-preview" id="parsed-preview" style="display:none"></div>

  <hr class="divider">

  <div class="section-label">Auto-filled from URL</div>
  <div class="row">
    <div class="field"><label>Username</label><input type="text" id="f-user" placeholder="flopp-r"></div>
    <div class="field"><label>Repository</label><input type="text" id="f-repo" placeholder="my-packages"></div>
  </div>
  <div class="row">
    <div class="field"><label>Branch</label><input type="text" id="f-branch" placeholder="main"></div>
    <div class="field"><label>File path in repo</label><input type="text" id="f-path" placeholder="files/tool.html"></div>
  </div>
  <div class="field">
    <label>Download filename</label>
    <input type="text" id="f-filename" placeholder="tool.html">
  </div>

  <hr class="divider">

  <div class="section-label">Package Details</div>
  <div class="row">
    <div class="field"><label>Name</label><input type="text" id="f-name" placeholder="My Cool Tool"></div>
    <div class="field"><label>Version</label><input type="text" id="f-version" placeholder="v1.0"></div>
  </div>
  <div class="field">
    <label>Description</label>
    <textarea id="f-desc" placeholder="A short description."></textarea>
  </div>
  <div class="field">
    <label>Category</label>
    <input type="text" id="f-category" placeholder="Tools">
  </div>
  <div class="field">
    <label>Tags</label>
    <div class="tag-input-row">
      <input type="text" id="tag-input" placeholder="e.g. html" onkeydown="if(event.key==='Enter'){addTag();event.preventDefault();}">
      <button class="btn-add" onclick="addTag()">+ Add</button>
    </div>
    <div class="tags-wrap" id="tags-wrap"></div>
  </div>
  <button class="btn-gen" onclick="generatePackage()">Generate Entry</button>
</div>

<!-- WEB TOOL FORM -->
<div class="card" id="tool-form" style="display:none">
  <div class="section-label">Web Tool Details</div>
  <div class="field">
    <label>Name</label>
    <input type="text" id="t-name" placeholder="My Web Tool">
  </div>
  <div class="field">
    <label>Description</label>
    <textarea id="t-desc" placeholder="What does this tool do?"></textarea>
  </div>
  <div class="field">
    <label>URL</label>
    <input type="text" id="t-url" placeholder="https://example.com">
  </div>
  <button class="btn-gen" onclick="generateTool()">Generate Entry</button>
</div>

<!-- OUTPUT -->
<div id="output-section" style="display:none">
  <h2>Your JSON entry</h2>
  <div class="output-box">
    <button class="btn-copy" id="copy-btn" onclick="copyOutput()">Copy</button>
    <pre id="output-code"></pre>
  </div>
  <div class="instructions">
    <p id="instructions-text"></p>
  </div>
</div>

<script>
var tags = [];
var currentMode = 'package';

function setMode(mode) {
  currentMode = mode;
  document.getElementById('pkg-form').style.display  = mode === 'package' ? 'block' : 'none';
  document.getElementById('tool-form').style.display = mode === 'webtool' ? 'block' : 'none';
  document.getElementById('btn-pkg').classList.toggle('active', mode === 'package');
  document.getElementById('btn-tool').classList.toggle('active', mode === 'webtool');
  document.getElementById('output-section').style.display = 'none';
}

function parseUrl() {
  var url = document.getElementById('raw-url').value.trim();
  url = url.replace(/\/refs\/heads\//, '/').replace(/\/refs\/tags\//, '/');
  var match = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)$/);
  if (!match) {
    document.getElementById('url-hint').textContent = 'Waiting for a valid raw.githubusercontent.com URL…';
    document.getElementById('parsed-preview').style.display = 'none';
    return;
  }
  var user = match[1], repo = match[2], branch = match[3], path = match[4];
  var fname = path.split('/').pop();
  document.getElementById('f-user').value     = user;
  document.getElementById('f-repo').value     = repo;
  document.getElementById('f-branch').value   = branch;
  document.getElementById('f-path').value     = path;
  document.getElementById('f-filename').value = fname;
  if (!document.getElementById('f-name').value) {
    var n = fname.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
    document.getElementById('f-name').value = n.charAt(0).toUpperCase() + n.slice(1);
  }
  var preview = document.getElementById('parsed-preview');
  preview.style.display = 'block';
  preview.textContent = '✓  ' + user + ' / ' + repo + ' / ' + branch + ' / ' + path;
  document.getElementById('url-hint').textContent = 'Looks good! Fill in the details below.';
}

function addTag() {
  var inp = document.getElementById('tag-input');
  var val = inp.value.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '');
  if (!val || tags.indexOf(val) !== -1) { inp.value = ''; return; }
  tags.push(val);
  inp.value = '';
  renderTags();
}

function removeTag(t) {
  tags = tags.filter(function(x) { return x !== t; });
  renderTags();
}

function renderTags() {
  var wrap = document.getElementById('tags-wrap');
  wrap.innerHTML = '';
  tags.forEach(function(t) {
    var pill = document.createElement('div');
    pill.className = 'tag-pill';
    pill.innerHTML = t + '<button onclick="removeTag(\'' + t + '\')">×</button>';
    wrap.appendChild(pill);
  });
}

function val(id) { return document.getElementById(id).value.trim(); }

function generatePackage() {
  var user = val('f-user'), repo = val('f-repo'), branch = val('f-branch');
  var path = val('f-path'), filename = val('f-filename'), name = val('f-name');
  if (!user || !repo || !path) { alert('Please paste a valid GitHub raw URL first.'); return; }
  if (!name) { alert('Please enter a package name.'); return; }
  var entry = {
    name: name, version: val('f-version') || 'v1.0',
    desc: val('f-desc') || '', category: val('f-category') || 'General',
    tags: tags.slice(), user: user, repo: repo, branch: branch,
    path: path, filename: filename || path.split('/').pop()
  };
  showOutput(JSON.stringify(entry, null, 2),
    '<b>1.</b> Open <b>packages.json</b> → pencil icon.<br>' +
    '<b>2.</b> Find the last <b>}</b> inside <b>"packages": [...]</b> and add a <b>,</b> after it.<br>' +
    '<b>3.</b> Paste this snippet after that comma, before the closing <b>]</b>.<br>' +
    '<b>4.</b> Click <b>Commit changes</b>.'
  );
}

function generateTool() {
  var name = document.getElementById('t-name').value.trim();
  var desc = document.getElementById('t-desc').value.trim();
  var url  = document.getElementById('t-url').value.trim();
  if (!name) { alert('Please enter a tool name.'); return; }
  if (!url)  { alert('Please enter a URL.'); return; }
  var entry = { name: name, desc: desc, url: url };
  showOutput(JSON.stringify(entry, null, 2),
    '<b>1.</b> Open <b>packages.json</b> → pencil icon.<br>' +
    '<b>2.</b> Find the last <b>}</b> inside <b>"webtools": [...]</b> and add a <b>,</b> after it.<br>' +
    '<b>3.</b> Paste this snippet after that comma, before the closing <b>]</b>.<br>' +
    '<b>4.</b> Click <b>Commit changes</b>.'
  );
}

function showOutput(json, instructions) {
  document.getElementById('output-code').textContent = json;
  document.getElementById('instructions-text').innerHTML = instructions;
  var sec = document.getElementById('output-section');
  sec.style.display = 'block';
  sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyOutput() {
  var text = document.getElementById('output-code').textContent;
  var btn = document.getElementById('copy-btn');
  navigator.clipboard.writeText(text).then(function() {
    btn.textContent = '✓ Copied';
    btn.classList.add('done');
    setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 2000);
  });
}
</script>
</body>
</html>
